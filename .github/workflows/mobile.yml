name: mobile

on:
  pull_request:
    paths: ["apps/mobile/**", "packages/contracts/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/contracts/**", ".github/workflows/mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: API client matches the contract (ADR 0004, NFR-MNT-04)
        run: |
          dart run swagger_parser
          git diff --exit-code -- lib/core/api/generated \
            || (echo "::error::The Dart API client is out of date. Run: dart run swagger_parser && dart run build_runner build -d" && exit 1)
      - name: Generate code (Riverpod, freezed, l10n)
        run: dart run build_runner build -d
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests with coverage (unit, widget, golden)
        run: flutter test --coverage
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK (dev flavor)
        run: flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.json

  # Release builds, iOS and store uploads run on Codemagic (codemagic.yaml).
