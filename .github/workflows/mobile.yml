name: mobile

on:
  pull_request:
    paths: ["apps/mobile/**", "packages/contracts/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/contracts/**", ".github/workflows/mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Generate code (Riverpod, l10n)
        run: dart run build_runner build -d
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests with coverage
        run: flutter test --coverage
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK (dev flavor)
        run: flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.json

  # Release builds, iOS and store uploads run on Codemagic (codemagic.yaml).
