name: api

on:
  pull_request:
    paths: ["apps/api/**", "packages/contracts/**", "pnpm-lock.yaml", ".dockerignore", "infra/backup/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/contracts/**", "pnpm-lock.yaml", ".dockerignore", "infra/backup/**", ".github/workflows/api.yml"]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belle
          POSTGRES_PASSWORD: belle
          POSTGRES_DB: belle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U belle -d belle"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://belle:belle@localhost:5432/belle?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # e2e tests create and migrate this database themselves (test/support/global-setup.ts).
      TEST_DATABASE_URL: postgresql://belle:belle@localhost:5432/belle_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @belle/api lint
      - name: Typecheck
        run: pnpm --filter @belle/api typecheck
      - name: Migrations apply cleanly
        run: pnpm --filter @belle/api exec prisma migrate deploy
      - name: Unit and e2e tests with coverage (NFR-MNT-01)
        run: pnpm --filter @belle/api test:cov
      - name: Build
        run: pnpm --filter @belle/api build
      - name: OpenAPI matches the code (NFR-MNT-04)
        run: |
          pnpm --filter @belle/api openapi:export
          git diff --exit-code packages/contracts/openapi.yaml \
            || (echo "::error::openapi.yaml is out of date. Run: pnpm --filter @belle/api openapi:export" && exit 1)

  image:
    # The API image builds and answers its health check (plan 3.8).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f apps/api/Dockerfile -t belle-api:ci .
      - name: Starts and is healthy
        run: |
          docker run -d --name api -p 3000:3000             -e NODE_ENV=staging             -e DATABASE_URL=postgresql://belle:belle@localhost:5432/belle             -e REDIS_URL=redis://localhost:6379             -e JWT_ACCESS_SECRET=ci-only-secret-ci-only-secret-ci-only-0000             belle-api:ci
          for i in $(seq 1 30); do
            curl -fs localhost:3000/v1/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  backup:
    # A backup of a migrated, seeded database restores and passes its checks
    # (NFR-REL-02), so a new migration cannot quietly break restores.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belle
          POSTGRES_PASSWORD: belle
          POSTGRES_DB: belle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U belle -d belle"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://belle:belle@localhost:5432/belle?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@belle/api..."
      - name: Migrate and seed
        run: |
          pnpm --filter @belle/api exec prisma migrate deploy
          pnpm --filter @belle/api seed
      - name: Back up, restore, check
        run: |
          docker build -t belle-backup:ci infra/backup
          mkdir -p keys backups
          docker run --rm -v "$PWD/keys:/keys" belle-backup:ci             sh -c 'age-keygen -o /keys/ci.key 2>&1 | sed "s/Public key: //"' > keys/ci.pub
          docker run --rm --network host -e DATABASE_URL -e BACKUP_AGE_RECIPIENT="$(cat keys/ci.pub)"             -v "$PWD/backups:/backups" belle-backup:ci backup.sh
          docker run --rm --network host -e DATABASE_URL -e BACKUP_AGE_IDENTITY=/keys/ci.key             -v "$PWD/backups:/backups" -v "$PWD/keys:/keys" belle-backup:ci restore-check.sh

  # Staging deploy is added once the hosting provider is chosen (OI-04).
