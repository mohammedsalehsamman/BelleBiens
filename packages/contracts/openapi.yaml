# Generated by apps/api (pnpm --filter @belle/api openapi:export). Do not edit by hand.
components:
  schemas:
    AppConfigDto:
      properties:
        auth:
          $ref: "#/components/schemas/AuthConfigDto"
        currency:
          $ref: "#/components/schemas/CurrencyConfigDto"
        features:
          $ref: "#/components/schemas/FeaturesConfigDto"
        minSupportedVersion:
