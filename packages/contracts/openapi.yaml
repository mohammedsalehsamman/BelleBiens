        isFavorite:
          description: False for guests
          type: boolean
        kind:
          allOf:
            - $ref: "#/components/schemas/ProductKind"
        leadTimeHours:
          description: FR-DLV-05
          example: 0
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
        occasions:
          items:
            type: string
          type: array
        optionGroups:
          items:
            $ref: "#/components/schemas/ProductOptionGroupDto"
          type: array
        pairings:
          description: '"Add to your gift"'
          items:
            $ref: "#/components/schemas/ProductCardDto"
          type: array
        priceFrom:
          description: Show "from" before the price (sizes cost more)
          type: boolean
        priceMinor:
          description: Base plus default options, SYP minor units
          example: 240000
          type: integer
        slug:
          example: red-rose-bouquet
          type: string
        stockLeft:
          description: Pieces left; null when made to order (FR-INV-01)
          nullable: true
          type: integer
        subtitle:
          $ref: "#/components/schemas/LocalizedTextDto"
      required:
        - id
        - slug
        - kind
        - categorySlug
        - name
        - subtitle
        - imageUrl
        - priceMinor
        - priceFrom
        - available
        - badges
        - stockLeft
        - leadTimeHours
        - category
        - description
        - images
        - optionGroups
        - allergens
        - occasions
        - colors
        - flowerTypes
        - customizable
        - earliestDeliveryInDays
        - pairings
        - isFavorite
      type: object
    ProductImageDto:
      properties:
        alt:
          $ref: "#/components/schemas/LocalizedTextDto"
        url:
          type: string
      required:
        - url
        - alt
      type: object
    ProductKind:
      enum:
        - BOUQUET
        - CAKE
        - SWEET
        - DRINK
        - GIFT
      type: string
    ProductOptionDto:
      properties:
        detail:
          $ref: "#/components/schemas/LocalizedTextDto"
        isDefault:
          type: boolean
        key:
          example: medium
          type: string
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
        priceChangeMinor:
          example: 60000
          type: integer
        swatch:
          example: "#7A1F3D"
          nullable: true
          type: string
      required:
        - key
        - name
        - detail
        - swatch
        - priceChangeMinor
        - isDefault
      type: object
    ProductOptionGroupDto:
      properties:
        key:
          example: size
          type: string
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
        options:
          items:
            $ref: "#/components/schemas/ProductOptionDto"
          type: array
        required:
          type: boolean
        selection:
          allOf:
            - $ref: "#/components/schemas/OptionSelection"
      required:
        - key
        - name
        - selection
        - required
        - options
      type: object
    ProductPageDto:
      properties:
        items:
          items:
            $ref: "#/components/schemas/ProductCardDto"
          type: array
        page:
          example: 1
          type: integer
        pageSize:
          example: 20
          type: integer
        total:
          example: 18
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
      type: object
    ProductSort:
      enum:
        - popular
        - newest
        - price_asc
        - price_desc
      type: string
    RefreshDto:
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
      type: object
    RegisterDeviceDto:
      properties:
        appVersion:
          example: 1.0.0+1
          type: string
        locale:
          enum:
            - ar
            - en
          type: string
        platform:
          enum:
            - android
            - ios
          type: string
        pushToken:
          description: FCM registration token
          type: string
      required:
        - platform
        - pushToken
      type: object
    RegisterDto:
      properties:
        acceptTerms:
          description: Must be true (LEG-01)
          type: boolean
        email:
          example: sara@example.com
          type: string
        marketingOptIn:
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        password:
          description: NFR-SEC-02
          minLength: 8
          type: string
      required:
        - name
        - email
        - password
        - acceptTerms
      type: object
    RequestOtpDto:
      properties:
        channel:
          default: sms
          description: Screen 04 offers WhatsApp instead of SMS
          enum:
            - sms
            - whatsapp
          type: string
        phone:
          description: 09XXXXXXXX, +9639XXXXXXXX or international (FR-CRT-09)
          example: "0944123456"
          type: string
      required:
        - phone
      type: object
    SearchFacetDto:
      properties:
        categorySlug:
          example: flowers
          type: string
        count:
          example: 4
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
      required:
        - categorySlug
        - name
        - count
      type: object
    SearchResultDto:
      properties:
        facets:
          description: Tabs on screen 08
          items:
            $ref: "#/components/schemas/SearchFacetDto"
          type: array
        items:
          items:
            $ref: "#/components/schemas/ProductCardDto"
          type: array
        query:
          example: جوري
          type: string
        total:
          description: Matches in every category
          example: 5
          type: integer
      required:
        - query
        - total
        - facets
        - items
      type: object
    ShopConfigDto:
      properties:
        mode:
          description: FR-ADM-12
          enum:
            - open
            - busy
            - closed
          type: string
        timeZone:
          example: Asia/Damascus
          type: string
        whatsapp:
          example: "+963944000000"
          nullable: true
          type: string
        workingHours:
          $ref: "#/components/schemas/WorkingHoursDto"
      required:
        - mode
        - workingHours
        - whatsapp
        - timeZone
      type: object
    ShopStatusDto:
      properties:
        closesAt:
          example: 24:00
          type: string
        mode:
          enum:
            - open
            - busy
            - closed
          type: string
        openNow:
          type: boolean
        opensAt:
          example: 10:00
          type: string
      required:
        - mode
        - openNow
        - opensAt
        - closesAt
      type: object
    StockAdjustmentDto:
      properties:
        delta:
          description: Positive adds, negative removes
          example: -2
          type: number
        reason:
          example: Two vases broke in delivery
          type: string
        slug:
          example: glass-vase
          type: string
        target:
          enum:
            - product
            - designerItem
          type: string
      required:
        - target
        - slug
        - delta
        - reason
      type: object
    StockMovementDto:
      properties:
        createdAt:
          format: date-time
          type: string
        delta:
          type: number
        id:
          type: string
        quantityAfter:
          type: number
        reason:
          type: string
        slug:
          type: string
        target:
          enum:
            - product
            - designerItem
          type: string
        userId:
          nullable: true
          type: string
      required:
        - id
        - target
        - slug
        - delta
        - quantityAfter
        - reason
        - userId
        - createdAt
      type: object
    TodayListDto:
      properties:
        productSlugs:
          description: Product slugs on today's list; others are taken off (FR-DLY-02)
          items:
            type: string
          type: array
      required:
        - productSlugs
      type: object
    UpdateDesignerItemDto:
      properties:
        colorTags:
          items:
            type: string
          type: array
        cutoutUrl:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        occasionTags:
          items:
            type: string
          type: array
        seasonFrom:
          description: FR-INV-06, MM-DD
          example: 03-01
          type: string
        seasonTo:
          example: 05-31
          type: string
        slug:
          example: red-rose
          type: string
        sortOrder:
          type: number
        status:
          enum:
            - ACTIVE
            - HIDDEN
          type: string
        stockQuantity:
          nullable: true
          type: number
        swatch:
          type: string
        type:
          enum:
            - FLOWER
            - GREEN
            - WRAP
            - RIBBON
            - EXTRA
          type: string
        unitPriceMinor:
          example: 9000
          type: number
      type: object
    UpdateMeDto:
      properties:
        acceptTerms:
          description: Send true to accept the terms (only true is allowed)
          type: boolean
        email:
          example: sara@example.com
          type: string
        homeArea:
          example: المزة
          type: string
        language:
          enum:
            - ar
            - en
          type: string
        marketingOptIn:
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        numerals:
          enum:
            - western
            - arabic
          type: string
      type: object
    UpdateProductDto:
      properties:
        allergens:
          items:
            type: string
          type: array
        basePriceMinor:
          description: SYP minor units
          example: 180000
          type: number
        bestSeller:
          type: boolean
        categorySlug:
          example: flowers
          type: string
        colors:
          items:
            enum:
              - red
              - pink
              - white
              - pastel
              - yellow
            type: string
          type: array
        dailyOnly:
          type: boolean
        descriptionAr:
          type: string
        descriptionEn:
          type: string
        designerTemplate:
          description: Bouquet spec (S3)
          nullable: true
          type: object
        flowerTypes:
          items:
            enum:
              - rose
              - peony
              - tulip
              - lisianthus
              - hydrangea
            type: string
          type: array
        images:
          items:
            $ref: "#/components/schemas/ImageInputDto"
          type: array
        kind:
          enum:
            - BOUQUET
            - CAKE
            - SWEET
            - DRINK
            - GIFT
          type: string
        leadTimeHours:
          example: 24
          type: number
        limited:
          type: boolean
        nameAr:
          type: string
        nameEn:
          type: string
        occasions:
          description: Occasion slugs
          items:
            type: string
          type: array
        optionGroups:
          description: Replaces all groups
          items:
            $ref: "#/components/schemas/OptionGroupInputDto"
          type: array
        pairings:
          description: Product slugs
          items:
            type: string
          type: array
        popularity:
          type: number
        seasonal:
          type: boolean
        slug:
          example: red-rose-bouquet
          type: string
        status:
          enum:
            - ACTIVE
            - HIDDEN
          type: string
        stockQuantity:
          description: null = made to order
          nullable: true
          type: number
        subtitleAr:
          type: string
        subtitleEn:
          type: string
      type: object
    VerifyOtpDto:
      properties:
        acceptTerms:
          description: Terms of use and privacy policy (LEG-01)
          type: boolean
        code:
          example: "4827"
          type: string
        email:
          example: sara@example.com
          type: string
        homeArea:
          example: أبو رمانة
          type: string
        marketingOptIn:
          description: FR-NTF-05
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        phone:
          example: "0944123456"
          type: string
      required:
        - phone
        - code
      type: object
    VocabularyDto:
      properties:
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
        slug:
          example: red
          type: string
        swatch:
          nullable: true
          type: string
      required:
        - slug
        - name
        - swatch
      type: object
    WorkingHoursDto:
      properties:
        close:
          example: 24:00
          type: string
        open:
          example: 10:00
          type: string
      required:
        - open
        - close
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: Shared REST API for the Belle Biens app, website and dashboard (BB-SRS-001). Errors use application/problem+json with a stable `code`.
  title: Belle Biens API
  version: "1"
openapi: 3.0.0
paths:
  /v1/admin/audit-log:
    get:
      operationId: AdminUsersController_auditLog
      parameters:
        - in: query
          name: entity
          required: false
          schema:
            example: user
            type: string
        - in: query
          name: limit
          required: false
          schema:
            example: 50
            maximum: 200
            type: number
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AuditEntryDto"
                type: array
          description: ""
      security:
        - bearer: []
      summary: Latest audit log entries (FR-ADM-09)
      tags:
        - admin
  /v1/admin/daily-flowers:
    put:
      operationId: AdminCatalogController_dailyFlowers
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyStemsInputDto"
        required: true
      responses:
        "204":
          description: ""
      security:
        - bearer: []
      summary: Set today's stems (FR-DLY-01); they expire at midnight
      tags:
        - admin
  /v1/admin/daily-products:
    put:
      operationId: AdminCatalogController_todayList
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodayListDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AdminProductDto"
                type: array
          description: ""
      security:
        - bearer: []
      summary: Set today's product list (FR-DLY-02)
      tags:
        - admin
  /v1/admin/designer-items:
    get:
      operationId: AdminCatalogController_designerItems
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AdminDesignerItemDto"
                type: array
          description: ""
      security:
        - bearer: []
      summary: Designer items with today's stems
      tags:
        - admin
    post:
      operationId: AdminCatalogController_createDesignerItem
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignerItemInputDto"
        required: true
      responses:
        "204":
          description: ""
      security:
        - bearer: []
      summary: Add a flower, green, wrap, ribbon or extra (FR-ADM-03)
      tags:
        - admin
  /v1/admin/designer-items/{id}:
    patch:
      operationId: AdminCatalogController_updateDesignerItem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDesignerItemDto"
        required: true
      responses:
        "204":
          description: ""
      security:
        - bearer: []
      summary: Change a designer item
      tags:
        - admin
  /v1/admin/media:
    post:
      operationId: MediaController_upload
      parameters:
        - in: query
          name: kind
          required: false
          schema:
            default: product
            enum:
              - product
              - cutout
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUploadDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDto"
          description: ""
      security:
        - bearer: []
      summary: "Upload a product photo or a designer cut-out (NFR-SEC-08: checked and re-encoded)"
      tags:
        - admin
  /v1/admin/products:
    get:
      operationId: AdminCatalogController_products
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AdminProductDto"
                type: array
          description: ""
      security:
        - bearer: []
      summary: Every product, hidden ones too
      tags:
        - admin
    post:
      operationId: AdminCatalogController_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDto"
          description: ""
      security:
        - bearer: []
      summary: Add a product with its options and photos (FR-ADM-02)
      tags:
        - admin
  /v1/admin/products/{id}:
    patch:
      operationId: AdminCatalogController_update
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDto"
          description: ""
      security:
        - bearer: []
      summary: Change a product; optionGroups and images replace the old ones
      tags:
        - admin
  /v1/admin/stock-adjustments:
    post:
      operationId: AdminCatalogController_adjust
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementDto"
          description: ""
      security:
        - bearer: []
      summary: Change a stock count with a reason (FR-INV-05)
      tags:
        - admin
  /v1/admin/stock-movements:
    get:
      operationId: AdminCatalogController_movements
      parameters:
        - in: query
          name: entity
          required: false
          schema:
            example: user
            type: string
        - in: query
          name: limit
          required: false
          schema:
            example: 50
            maximum: 200
            type: number
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/StockMovementDto"
                type: array
          description: ""
      security:
        - bearer: []
      summary: Latest stock changes (DR-12)
      tags:
        - admin
  /v1/admin/users/{id}/role:
    patch:
      operationId: AdminUsersController_changeRole
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeDto"
          description: ""
      security:
        - bearer: []
      summary: Change a user role (Owner only, audited)
      tags:
        - admin
  /v1/app/config:
    get:
      operationId: AppConfigController_appConfig
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfigDto"
          description: ""
      summary: Everything the app needs at start-up, in one call
      tags:
        - app
  /v1/auth/google:
    post:
      operationId: AuthController_google
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Sign in with a Google ID token (EI-SW-06)
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Sign in with email and password
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDto"
        required: true
      responses:
        "204":
          description: ""
      summary: End the session of this refresh token
      tags:
        - auth
  /v1/auth/otp/request:
    post:
      operationId: AuthController_requestOtp
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpDto"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestedDto"
          description: ""
      summary: Send a sign-in code by SMS or WhatsApp (screens 02, 03)
      tags:
        - auth
  /v1/auth/otp/verify:
    post:
      operationId: AuthController_verifyOtp
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Check the code and sign in; creates the account on first use (screen 04)
      tags:
        - auth
  /v1/auth/password/reset:
    post:
      operationId: AuthController_confirmReset
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmDto"
        required: true
      responses:
        "204":
          description: ""
      summary: Set a new password with the emailed token; ends all sessions
      tags:
        - auth
  /v1/auth/password/reset-request:
    post:
      operationId: AuthController_requestReset
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestDto"
        required: true
      responses:
        "202":
          description: ""
      summary: Email a password reset link (FR-ACC-02). Always 202.
      tags:
        - auth
  /v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Exchange a refresh token for a new pair (the old one stops working)
      tags:
        - auth
  /v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Create an account with email and password (FR-ACC-01)
      tags:
        - auth
  /v1/branch:
    get:
      operationId: CatalogController_branch
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDto"
          description: ""
      summary: Branch, hours and contact (screen 34, FR-CON-03)
      tags:
        - catalog
  /v1/catalog/filters:
    get:
