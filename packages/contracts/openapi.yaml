        - shop
        - currency
        - payments
        - auth
        - features
      type: object
    AuditEntryDto:
      properties:
        action:
          example: user.role.change
          type: string
        actorId:
          nullable: true
          type: string
        actorRole:
          enum:
            - CUSTOMER
            - OWNER
            - MANAGER
            - FLORIST
            - DELIVERY_COORDINATOR
          nullable: true
          type: string
        after:
          nullable: true
          type: object
        before:
          nullable: true
          type: object
        createdAt:
          format: date-time
          type: string
        entity:
          example: user
          type: string
        entityId:
          nullable: true
          type: string
        id:
          type: string
      required:
        - id
        - actorId
        - actorRole
        - action
        - entity
        - entityId
        - before
        - after
        - createdAt
      type: object
    AuthConfigDto:
      properties:
        google:
          description: Google sign-in is configured (EI-SW-06)
          type: boolean
        otpChannels:
          example:
            - sms
            - whatsapp
          items:
            type: string
          type: array
        otpLength:
          example: 4
          type: number
        otpResendSeconds:
          example: 60
          type: number
      required:
        - otpLength
        - otpResendSeconds
        - otpChannels
        - google
      type: object
    AuthSessionDto:
      properties:
        accessToken:
          type: string
        accessTokenExpiresIn:
          description: Seconds
          example: 900
          type: number
        isNewUser:
          description: The account was created by this call
          type: boolean
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/MeDto"
      required:
        - accessToken
        - accessTokenExpiresIn
        - refreshToken
        - refreshTokenExpiresAt
        - isNewUser
        - user
      type: object
    ChangeRoleDto:
      properties:
        role:
          enum:
            - CUSTOMER
            - OWNER
            - MANAGER
            - FLORIST
            - DELIVERY_COORDINATOR
          type: string
      required:
        - role
      type: object
    CurrencyConfigDto:
      properties:
        base:
          example: SYP
          type: string
        usdRate:
          description: SYP per 1 USD, decimal string (FR-PAY-05)
          example: "120"
          type: string
      required:
        - base
        - usdRate
      type: object
    FeaturesConfigDto:
      properties:
        aiPreview:
          description: FR-DAI, release 3
          type: boolean
        designer3d:
          description: FR-D3D, release 3
          type: boolean
      required:
        - designer3d
        - aiPreview
      type: object
    GoogleSignInDto:
      properties:
        acceptTerms:
          description: Terms of use and privacy policy (LEG-01)
          type: boolean
        email:
          example: sara@example.com
          type: string
        homeArea:
          example: أبو رمانة
          type: string
        idToken:
          description: ID token from Google Sign-In on the device
          type: string
        marketingOptIn:
          description: FR-NTF-05
          type: boolean
        name:
          example: سارة الأحمد
          type: string
      required:
        - idToken
      type: object
    LivenessDto:
      properties:
        status:
          example: ok
          type: string
        time:
          description: Server time (UTC)
          example: 2026-11-11T09:00:00.000Z
          type: string
      required:
        - status
        - time
      type: object
    LoginDto:
      properties:
        email:
          example: sara@example.com
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    MeDto:
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          example: sara@example.com
          nullable: true
          type: string
        homeArea:
          example: أبو رمانة
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        language:
          enum:
            - ar
            - en
          type: string
        marketingOptIn:
          description: "FR-NTF-05: offers and occasion reminders"
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        numerals:
          description: FR-LOC-02
          enum:
            - western
            - arabic
          type: string
        phone:
          example: "+963944123456"
          nullable: true
          type: string
        profileComplete:
          description: False until a name is set; the app asks for it once
          type: boolean
        role:
          enum:
            - CUSTOMER
            - OWNER
            - MANAGER
            - FLORIST
            - DELIVERY_COORDINATOR
          type: string
        termsAccepted:
          description: Terms of use and privacy policy accepted (LEG-01)
          type: boolean
      required:
        - id
        - name
        - phone
        - email
        - role
        - language
        - numerals
        - marketingOptIn
        - homeArea
        - termsAccepted
        - profileComplete
        - createdAt
      type: object
    OtpRequestedDto:
      properties:
        channel:
          enum:
            - sms
            - whatsapp
          type: string
        codeLength:
          example: 4
          type: number
        expiresInSeconds:
          example: 300
          type: number
        maskedPhone:
          example: +963 944 *** 456
          type: string
        phone:
          example: "+963944123456"
          type: string
        resendAfterSeconds:
          example: 60
          type: number
      required:
        - phone
        - maskedPhone
        - channel
        - codeLength
        - expiresInSeconds
        - resendAfterSeconds
      type: object
    PasswordResetConfirmDto:
      properties:
        newPassword:
          minLength: 8
          type: string
        token:
          type: string
      required:
        - token
        - newPassword
      type: object
    PasswordResetRequestDto:
      properties:
        email:
          example: sara@example.com
          type: string
      required:
        - email
      type: object
    PaymentsConfigDto:
      properties:
        cash:
          type: boolean
        shamcash:
          type: boolean
        stripe:
          type: boolean
      required:
        - cash
        - shamcash
        - stripe
      type: object
    RefreshDto:
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
      type: object
    RegisterDeviceDto:
      properties:
        appVersion:
          example: 1.0.0+1
          type: string
        locale:
          enum:
            - ar
            - en
          type: string
        platform:
          enum:
            - android
            - ios
          type: string
        pushToken:
          description: FCM registration token
          type: string
      required:
        - platform
        - pushToken
      type: object
    RegisterDto:
      properties:
        acceptTerms:
          description: Must be true (LEG-01)
          type: boolean
        email:
          example: sara@example.com
          type: string
        marketingOptIn:
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        password:
          description: NFR-SEC-02
          minLength: 8
          type: string
      required:
        - name
        - email
        - password
        - acceptTerms
      type: object
    RequestOtpDto:
      properties:
        channel:
          default: sms
          description: Screen 04 offers WhatsApp instead of SMS
          enum:
            - sms
            - whatsapp
          type: string
        phone:
          description: 09XXXXXXXX, +9639XXXXXXXX or international (FR-CRT-09)
          example: "0944123456"
          type: string
      required:
        - phone
      type: object
    ShopConfigDto:
      properties:
        mode:
          description: FR-ADM-12
          enum:
            - open
            - busy
            - closed
          type: string
        timeZone:
          example: Asia/Damascus
          type: string
        whatsapp:
          example: "+963944000000"
          nullable: true
          type: string
        workingHours:
          $ref: "#/components/schemas/WorkingHoursDto"
      required:
        - mode
        - workingHours
        - whatsapp
        - timeZone
      type: object
    UpdateMeDto:
      properties:
        acceptTerms:
          description: Send true to accept the terms (only true is allowed)
          type: boolean
        email:
          example: sara@example.com
          type: string
        homeArea:
          example: المزة
          type: string
        language:
          enum:
            - ar
            - en
          type: string
        marketingOptIn:
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        numerals:
          enum:
            - western
            - arabic
          type: string
      type: object
    VerifyOtpDto:
      properties:
        acceptTerms:
          description: Terms of use and privacy policy (LEG-01)
          type: boolean
        code:
          example: "4827"
          type: string
        email:
          example: sara@example.com
          type: string
        homeArea:
          example: أبو رمانة
          type: string
        marketingOptIn:
          description: FR-NTF-05
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        phone:
          example: "0944123456"
          type: string
      required:
        - phone
        - code
      type: object
    WorkingHoursDto:
      properties:
        close:
          example: 24:00
          type: string
        open:
          example: 10:00
          type: string
      required:
        - open
        - close
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: Shared REST API for the Belle Biens app, website and dashboard (BB-SRS-001). Errors use application/problem+json with a stable `code`.
  title: Belle Biens API
  version: "1"
openapi: 3.0.0
paths:
  /v1/admin/audit-log:
    get:
      operationId: AdminUsersController_auditLog
      parameters:
        - in: query
          name: entity
          required: false
          schema:
            example: user
            type: string
        - in: query
          name: limit
          required: false
          schema:
            example: 50
            maximum: 200
            type: number
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AuditEntryDto"
                type: array
          description: ""
      security:
        - bearer: []
      summary: Latest audit log entries (FR-ADM-09)
      tags:
        - admin
  /v1/admin/users/{id}/role:
    patch:
      operationId: AdminUsersController_changeRole
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeDto"
          description: ""
      security:
        - bearer: []
      summary: Change a user role (Owner only, audited)
      tags:
        - admin
  /v1/app/config:
    get:
      operationId: AppConfigController_appConfig
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfigDto"
          description: ""
      summary: Everything the app needs at start-up, in one call
      tags:
        - app
  /v1/auth/google:
    post:
      operationId: AuthController_google
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Sign in with a Google ID token (EI-SW-06)
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Sign in with email and password
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDto"
        required: true
      responses:
        "204":
          description: ""
      summary: End the session of this refresh token
      tags:
        - auth
  /v1/auth/otp/request:
    post:
      operationId: AuthController_requestOtp
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpDto"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestedDto"
          description: ""
      summary: Send a sign-in code by SMS or WhatsApp (screens 02, 03)
      tags:
        - auth
  /v1/auth/otp/verify:
    post:
      operationId: AuthController_verifyOtp
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Check the code and sign in; creates the account on first use (screen 04)
      tags:
        - auth
  /v1/auth/password/reset:
    post:
      operationId: AuthController_confirmReset
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmDto"
        required: true
      responses:
        "204":
          description: ""
      summary: Set a new password with the emailed token; ends all sessions
      tags:
        - auth
  /v1/auth/password/reset-request:
    post:
      operationId: AuthController_requestReset
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestDto"
        required: true
      responses:
        "202":
          description: ""
      summary: Email a password reset link (FR-ACC-02). Always 202.
      tags:
        - auth
  /v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Exchange a refresh token for a new pair (the old one stops working)
      tags:
        - auth
  /v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionDto"
          description: ""
      summary: Create an account with email and password (FR-ACC-01)
      tags:
        - auth
  /v1/health:
    get:
      operationId: HealthController_liveness
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessDto"
          description: ""
      summary: "Liveness: the process is up. Does not touch the database."
      tags:
        - health
  /v1/health/ready:
    get:
      operationId: HealthController_readiness
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  details:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                    type: object
                  error:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example: {}
                    nullable: true
                    type: object
                  info:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                    nullable: true
                    type: object
                  status:
                    enum:
                      - ok
                      - degraded
                    example: ok
                    type: string
                type: object
          description: The Health Check is successful
        "503":
          content:
            application/json:
              schema:
                properties:
                  details:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                      redis:
                        message: Could not connect
                        responseTime: 3005
                        status: down
                    type: object
                  error:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      redis:
                        message: Could not connect
                        responseTime: 3005
                        status: down
                    nullable: true
                    type: object
                  info:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                    nullable: true
                    type: object
                  status:
                    enum:
                      - error
                      - shutting_down
                    example: error
                    type: string
                type: object
          description: The Health Check is not successful
      summary: "Readiness: dependencies (database) are reachable. 503 otherwise."
      tags:
        - health
  /v1/me:
    get:
      operationId: MeController_get
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeDto"
          description: ""
      security:
        - bearer: []
      summary: The signed-in profile
      tags:
        - me
    patch:
      operationId: MeController_update
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeDto"
          description: ""
      security:
        - bearer: []
      summary: Edit name, email, language, digits, marketing consent (FR-ACC-03)
      tags:
        - me
  /v1/me/devices:
    put:
      operationId: MeController_registerDevice
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceDto"
        required: true
      responses:
        "204":
          description: ""
      security:
        - bearer: []
      summary: Register this phone for push notifications (EI-SW-09)
      tags:
        - me
  /v1/me/devices/{pushToken}:
    delete:
      operationId: MeController_removeDevice
      parameters:
        - in: path
          name: pushToken
          required: true
          schema:
            type: string
      responses:
        "204":
          description: ""
      security:
        - bearer: []
      summary: Stop sending this account notifications to this phone
      tags:
        - me
servers: []
tags: []
