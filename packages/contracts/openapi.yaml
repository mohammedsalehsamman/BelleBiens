      summary: "Liveness: the process is up. Does not touch the database."
      tags:
        - health
  /v1/health/ready:
    get:
      operationId: HealthController_readiness
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  details:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                    type: object
                  error:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example: {}
                    nullable: true
                    type: object
                  info:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                    nullable: true
                    type: object
                  status:
                    enum:
                      - ok
                      - degraded
                    example: ok
                    type: string
                type: object
          description: The Health Check is successful
        "503":
          content:
            application/json:
              schema:
                properties:
                  details:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                      redis:
                        message: Could not connect
                        responseTime: 3005
                        status: down
                    type: object
                  error:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      redis:
                        message: Could not connect
                        responseTime: 3005
                        status: down
                    nullable: true
                    type: object
                  info:
                    additionalProperties:
                      additionalProperties: true
                      properties:
                        responseTime:
                          description: Time the health indicator took to respond, in ms
                          type: number
                        status:
                          enum:
                            - up
                            - degraded
                            - down
                          type: string
                      required:
                        - status
                      type: object
                    example:
                      database:
                        responseTime: 12
                        status: up
                    nullable: true
                    type: object
                  status:
                    enum:
                      - error
                      - shutting_down
                    example: error
                    type: string
                type: object
          description: The Health Check is not successful
      summary: "Readiness: dependencies (database) are reachable. 503 otherwise."
      tags:
        - health
