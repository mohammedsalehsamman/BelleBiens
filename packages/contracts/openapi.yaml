          example: أبو رمانة
          type: string
        marketingOptIn:
          description: FR-NTF-05
          type: boolean
        name:
          example: سارة الأحمد
          type: string
        phone:
          example: "0944123456"
          type: string
      required:
        - phone
        - code
      type: object
    VocabularyDto:
      properties:
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
        slug:
          example: red
          type: string
        swatch:
          nullable: true
          type: string
      required:
        - slug
        - name
        - swatch
      type: object
    WorkingHoursDto:
      properties:
        close:
          example: 24:00
          type: string
        open:
          example: 10:00
          type: string
      required:
        - open
        - close
      type: object
    ZoneCheckDto:
      properties:
        inZone:
          description: "FR-DLV-01: the pin is inside a delivery zone"
          type: boolean
        zone:
          $ref: "#/components/schemas/ZoneDto"
      required:
        - inZone
      type: object
    ZoneDto:
      properties:
        eta:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextDto"
          description: Estimated delivery time, as the shop writes it
        feeMinor:
          example: 15000
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
        slug:
          example: abu-rummaneh
          type: string
      required:
        - slug
        - name
        - feeMinor
        - eta
      type: object
    ZoneInputDto:
      properties:
        active:
          type: boolean
        etaAr:
          type: string
        etaEn:
          type: string
        feeMinor:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: string
        polygon:
          description: "[longitude, latitude] corners, at least three"
          items:
            items:
              type: number
            type: array
          type: array
        slug:
          example: abu-rummaneh
          type: string
        sortOrder:
          type: integer
      required:
        - slug
        - nameAr
        - nameEn
        - polygon
        - feeMinor
      type: object
    ZoneWithAreaDto:
      properties:
        eta:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextDto"
          description: Estimated delivery time, as the shop writes it
        feeMinor:
          example: 15000
          type: integer
        name:
          $ref: "#/components/schemas/LocalizedTextDto"
        polygon:
          description: Ring of [longitude, latitude] points (GeoJSON order)
          items:
            items:
              type: number
            type: array
          type: array
        slug:
          example: abu-rummaneh
          type: string
      required:
        - slug
        - name
        - feeMinor
        - eta
        - polygon
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
